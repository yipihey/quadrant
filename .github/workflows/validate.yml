name: Validate template and publish the demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: template/core
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Create a report from the template
        run: |
          sh scripts/new-report.sh ../demo ${{ github.repository }}
          # the demo's sources live under template/ of this repository, and its workflow is validate.yml
          sed -i 's|^  repo-branch: main$|  repo-branch: main\n  repo-subdir: template|' ../demo/_quarto.yml
          sed -i 's|workflows/publish.yml|workflows/validate.yml|' ../demo/chapters/status.qmd
      - name: Test, build and document the core
        working-directory: ../demo
        run: |
          cargo test --release --manifest-path core/Cargo.toml
          make wasm
          make api
      - name: Check provenance links
        working-directory: ../demo
        run: python3 scripts/check_links.py
      - name: Render
        working-directory: ../demo
        run: quarto render
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../demo/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
